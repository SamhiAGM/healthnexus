name: Backend CI

on:
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'

jobs:
  test:
    name: Compile and test backend (Java 21)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: backend
    env:
      JWT_SECRET: ci-test-jwt-secret-not-for-production
      SPRING_DATA_MONGODB_URI: mongodb://127.0.0.1:27017/healthconnect_ci
      SPRING_DATA_MONGODB_DATABASE: healthconnect_ci
      APP_SEEDING_ENABLED: "false"
      APP_SEEDING_PASSWORD: ""
      EMAIL_PROVIDER: gmail
      SPRING_MAIL_PASSWORD: ""

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Compile and run backend unit and context tests
        run: mvn --batch-mode --errors "-Dtest=!EmailOtpMongoReplicaSetIntegrationTest" test

      - name: Run MongoDB replica-set integration tests
        run: mvn --batch-mode --errors -Dtest=EmailOtpMongoReplicaSetIntegrationTest test
