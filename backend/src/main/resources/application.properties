# Spring Boot Application Configuration for HealthConnect LK

spring.application.name=healthconnect-backend
server.port=8080

# MongoDB Configuration (Defaults to Docker Compose settings, overridable via environment variables)
spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI:mongodb://health_admin:health_secure_password_dev@localhost:27017/healthconnect_db?authSource=admin}
spring.data.mongodb.auto-index-creation=true

# Actuator Endpoints for Health Checks and Observability
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# Logging
logging.level.com.healthconnect=INFO
logging.level.org.springframework.security=INFO
