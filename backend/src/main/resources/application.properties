# Spring Boot Application Configuration for LankaCare.me / HealthConnect LK

spring.application.name=healthconnect-backend
server.port=8080

# MongoDB Configuration (Resolved via Azure / hosting environment variables, local fallback)
spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/healthconnect_db}
spring.data.mongodb.database=${SPRING_DATA_MONGODB_DATABASE:healthconnect_db}
spring.data.mongodb.auto-index-creation=true

# Actuator Endpoints for Health Checks (Production Safe: shows only status, no server internals)
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# JWT Configuration
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=86400000

# Security and Seeding Controls (Disabled by default in production)
lankacare.seed.enabled=${APP_SEEDING_ENABLED:false}
lankacare.seed.password=${APP_SEEDING_PASSWORD:}
lankacare.cookie.secure=${COOKIE_SECURE:true}
lankacare.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://www.lankacare.me,https://lankacare.me,http://localhost:3000}

# Logging (Safe levels, sensitive parameters are never logged)
logging.level.com.healthconnect=INFO
logging.level.org.springframework.security=INFO

# Spring Mail / Gmail SMTP Configuration for HealthNexus
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:Healthnexus.support@gmail.com}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

healthnexus.mail.sender-name=HealthNexus Support
healthnexus.mail.from-address=${SPRING_MAIL_USERNAME:Healthnexus.support@gmail.com}
lankacare.otp.hmac-secret=${OTP_HMAC_SECRET:${jwt.secret:}}
