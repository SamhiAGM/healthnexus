# Spring Boot Application Configuration for HealthConnect LK

spring.application.name=healthconnect-backend
server.port=8080

# MongoDB Configuration (MongoDB Atlas connection string, overridable via SPRING_DATA_MONGODB_URI)
spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI}

# Actuator Endpoints for Health Checks and Observability
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=never

# Logging
logging.level.com.healthconnect=INFO
logging.level.org.springframework.security=INFO
